<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#120c24" />
      <stop offset="100%" stop-color="#0b172a" />
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <radialGradient id="glowPurple" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBlue" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#3a86ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3a86ff" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#c4b5fd" />
    </linearGradient>

    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="badgeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filter for soft neon glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Dynamic pulsing and rotating background animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.15); opacity: 0.55; }
    }
    @keyframes floatWave {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes orbitSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .pulsing-orb {
      animation: pulseOrb 7s ease-in-out infinite;
      transform-origin: center;
    }
    .wave-line {
      stroke-dasharray: 20, 10;
      animation: dashMove 30s linear infinite;
    }
    .floating-card {
      animation: floatWave 6s ease-in-out infinite;
    }
    .orbiting {
      animation: orbitSpin 25s linear infinite;
      transform-origin: 1050px 100px;
    }
  </style>

  <!-- Deep Dark Cyber Canvas -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />

  <!-- Ambient Glow Orbs -->
  <rect width="1200" height="360" fill="url(#glowPurple)" />
  <rect width="1200" height="360" fill="url(#glowBlue)" />

  <!-- Dynamic Geometric Grid & Graph Elements (Motion Graphics aesthetic) -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="0.75">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Animated Sinusoidal Motion Waves (Vector Curve Graph) in the background -->
  <path class="wave-line" d="M 0 280 C 300 180, 500 360, 800 240 C 950 180, 1100 300, 1200 220" 
        fill="none" stroke="url(#lineGrad)" stroke-width="3" opacity="0.6" />
  <path class="wave-line" d="M 0 310 C 250 240, 550 340, 850 200 C 1000 130, 1150 260, 1200 250" 
        fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.35" />

  <!-- Orbiting Geometry Nodes in background corner -->
  <g class="orbiting" opacity="0.4">
    <circle cx="1050" cy="100" r="55" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6,6" />
    <circle cx="1050" cy="45" r="7" fill="#ec4899" />
    <circle cx="1105" cy="100" r="5" fill="#38bdf8" />
    <circle cx="995" cy="100" r="6" fill="#a855f7" />
  </g>

  <!-- Keyframe Timeline Accent Icon Background (Far Right) -->
  <g transform="translate(930, 190)" opacity="0.35">
    <!-- Keyframe Diamond Nodes -->
    <polygon points="0,-12 12,0 0,12 -12,0" fill="#a855f7" />
    <line x1="0" y1="0" x2="100" y2="0" stroke="#a855f7" stroke-width="2" />
    <polygon points="100,-12 112,0 100,12 88,0" fill="#ec4899" />
    <line x1="100" y1="0" x2="180" y2="0" stroke="#ec4899" stroke-width="2" />
    <polygon points="180,-12 192,0 180,12 168,0" fill="#38bdf8" />
  </g>

  <!-- Foreground Content: Brand & Typography (Always on top with high contrast) -->
  <g transform="translate(80, 75)">
    <!-- Category Pill Badge -->
    <g>
      <rect width="260" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="15" r="4.5" fill="#10b981" />
      <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="0.5">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">
      Awesome Motion Graphics
    </text>
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="44" font-weight="900" fill="#818cf8" letter-spacing="-0.5">
      &amp; Animation Engines
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      SaaS Studios • Open-Source Video-as-Code • Vector Runtimes • WebGL &amp; Lottie/Rive Frameworks
    </text>

    <!-- Interactive Badges in Foreground -->
    <g transform="translate(0, 205)">
      <!-- Badge 1: 2D/3D Studios -->
      <g>
        <rect width="135" height="28" rx="6" fill="#18182e" stroke="#3730a3" stroke-width="1" />
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#c7d2fe">🎬 Motion Studios</text>
      </g>
      <!-- Badge 2: Code Animation -->
      <g transform="translate(145, 0)">
        <rect width="135" height="28" rx="6" fill="#18182e" stroke="#3730a3" stroke-width="1" />
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#c7d2fe">⚡ Code-to-Video</text>
      </g>
      <!-- Badge 3: Web Runtimes -->
      <g transform="translate(290, 0)">
        <rect width="130" height="28" rx="6" fill="#18182e" stroke="#3730a3" stroke-width="1" />
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#c7d2fe">🚀 Web Runtimes</text>
      </g>
      <!-- Badge 4: Open Source -->
      <g transform="translate(430, 0)">
        <rect width="130" height="28" rx="6" fill="#18182e" stroke="#047857" stroke-width="1" />
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">⭐ 100% Curated</text>
      </g>
    </g>
  </g>
</svg>
